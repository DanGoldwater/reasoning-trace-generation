[project]
name = "reasoning-trace-generation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=4.0.0",
    "httpx>=0.28.1",
    "petname>=2.9",
    "pydantic-ai-slim[anthropic,openai]>=2.40.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.1.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "matplotlib>=3.11.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.6",
    "ty>=0.0.78",
]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportExplicitAny = "error"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "Use a concrete type, generic, or validated object boundary."
"typing_extensions.Any".msg = "Use a concrete type, generic, or validated object boundary."

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
timeout = 10
asyncio_mode = "auto"
markers = [
    "integration: exercises a real local Ollama server and model (no mocks)",
]
